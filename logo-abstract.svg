<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Abstract circular logo">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#6b6bff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" rx="40" fill="transparent"/>

  <!-- outer circle -->
  <circle cx="200" cy="160" r="110" fill="url(#g1)" filter="url(#shadow)" />

  <!-- inner cutout to make an O-shape -->
  <circle cx="200" cy="160" r="62" fill="#fff" />

  <!-- small accent dot -->
  <circle cx="280" cy="240" r="14" fill="#ffd166" />

</svg>